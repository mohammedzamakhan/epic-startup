# Fly.io deployment configuration for Menuza Admin
# Alternative to Cloudflare Workers deployment

app = "menuza-admin"
primary_region = "bah" # Bahrain (Middle East)

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 150
    soft_limit = 75

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/resources/healthcheck"

# Shared SQLite database mount (read-only from app's primary)
[[mounts]]
  source = "menuza_data"
  destination = "/data"
  initial_size = "10gb"

[regions]
  bah = { machines = 1 } # Bahrain

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 150
    soft_limit = 75

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
