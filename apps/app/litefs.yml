# LiteFS configuration for SQLite replication on Fly.io
# See https://fly.io/docs/litefs/

fuse:
  dir: "/litefs"
  allow-other: true

data:
  dir: "/data/litefs"

exec:
  - cmd: "node /app/server/index.js"
    if-candidate: true

lease:
  type: "consul"
  advertise-url: "http://${FLY_ALLOC_ID}.vm.${FLY_APP_NAME}.internal:20202"
  candidate: ${FLY_REGION == PRIMARY_REGION}
  promote: true

  consul:
    url: "${FLY_CONSUL_URL}"
    key: "menuza-app/primary"

proxy:
  addr: ":20202"
  target: "localhost:8080"
  db: "data.db"

tracing:
  enabled: true
  level: "debug"
